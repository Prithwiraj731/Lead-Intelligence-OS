services:
  leadintel-postgres:
    image: postgres:16-alpine
    container_name: leadintel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: leadintel_db
    ports:
      - "5432:5432"
    volumes:
      - leadintel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leadintel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  leadintel_postgres_data:
    name: leadintel_postgres_data
